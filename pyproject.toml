[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolock"
version = "0.1.0"
description = "ChronoLock: timezone-aware linguistic alignment. Time-of-release is a semantic modifier. Advisory hygiene, not a scheduler (Aziel Eliab, 2026)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "advisory",
    "timezone",
    "language",
    "dialect",
    "release-window",
    "chronolect",
    "chronolock",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
chronolock = "chronolock.cli:main"
staticclock = "chronolock.cli:staticclock_main"

[project.urls]
Homepage = "https://github.com/AzielEliab/chronolock"
Download = "https://chronolock-download-tracker.vibelock.workers.dev/download?asset=chronolock-0.1.0.tar.gz"
Issues = "https://github.com/AzielEliab/chronolock/issues"
Counted-downloads = "https://chronolock-download-tracker.vibelock.workers.dev/"

[tool.setuptools.packages.find]
include = ["chronolock*"]

[tool.setuptools.package-data]
chronolock = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
